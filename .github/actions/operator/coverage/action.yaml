name: "Code Coverage Reporting"
description: "Check code coverage. Requires: permissions.pull-requests: write"
inputs:
  TARGET_BRANCH:
    description: >-
      Branch to diff coverage against. Defaults to the PR base branch
      (so a stacked PR is compared to its parent), or main on push events.
    required: false
    default: ${{ github.base_ref || 'main' }}

  # Go Test Coverage configuration file.
  COVERAGE_CONFIG:
    description: Go test coverage config file
    required: false
    default: ./.github/.testcoverage.yml

  # This is the coverage profile file generated by `go test -coverprofile=cover.out`
  COVERAGE_PROFILE:
    description: Go test coverage profile file
    required: false
    default: cover.out

runs:
  using: "composite"
  steps:
    - name: Check if coverage profile file exists
      shell: bash
      run: |
          if [ ! -f ${{ inputs.COVERAGE_PROFILE }} ]; then
              echo -e "\033[0;31mCoverage profile file does not exist\033[0m"
              echo -e "Make sure to run either:"
              echo -e "  \033[0;34mgo test ./... -coverprofile=${{ inputs.COVERAGE_PROFILE }} -covermode=atomic -coverpkg=./...\033[0m"
              echo -e "  \033[0;34mmake test\033[0m"
              echo ""
              echo -e "\033[0;31mBefore running this action\033[0m"
              exit 1
          fi

    # Pull the breakdown produced by the latest run on the base branch.
    # For a stacked PR this is the parent PR's branch; for the bottom of the stack it's main.
    - name: download base breakdown
      id: download-breakdown
      uses: dawidd6/action-download-artifact@v27
      with:
        branch: ${{ inputs.TARGET_BRANCH }}
        workflow_conclusion: completed   # a parent that failed the threshold is still a valid base
        search_artifacts: true           # walk back to the newest run that actually has the artifact
        name: coverage.breakdown
        path: .coverage-base
        if_no_artifact_found: warn

    - name: check test coverage
      uses: vladopajic/go-test-coverage@v2
      id: coverage
      continue-on-error: true # Should fail after coverage comment is posted
      with:
        config: ${{ inputs.COVERAGE_CONFIG }}
        profile: ${{ inputs.COVERAGE_PROFILE }}
        # Always produce a breakdown so any PR stacked on top of this branch can diff against it.
        breakdown-file-name: coverage.breakdown
        diff-base-breakdown-file-name: ${{ steps.download-breakdown.outputs.found_artifact == 'true' && '.coverage-base/coverage.breakdown' || '' }}

    # Upload before the final fail step so children of a failing PR still get a base.
    - name: upload breakdown for this branch
      uses: actions/upload-artifact@v5
      with:
        name: coverage.breakdown
        path: coverage.breakdown
        if-no-files-found: error

    - uses: jwalton/gh-find-current-pr@master
      id: PR
      with:
        github-token: ${{ env.GITHUB_TOKEN }}
        state: open

    - name: post coverage report
      uses: mshick/add-pr-comment@v3
      if: steps.PR.outputs.number && steps.coverage.outputs.report != ''
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
      with:
        message-id: coverage-report
        message: |-
          coverage report (diff vs `${{ inputs.TARGET_BRANCH }}`):
          ```
          ${{ fromJSON(steps.coverage.outputs.report) }}
          ```

    - name: "finally check coverage"
      if: steps.coverage.outcome == 'failure'
      shell: bash
      run: echo "coverage check failed" && exit 1
